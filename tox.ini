[tox]
envlist = pre-commit,mypy,pylint,min,py310,py311,py312,py313,py314,docs,twine,coverage
minversion = 1.7.0

[testenv]
deps =
    pytest==9.0.2
    pytest-cov==7.0.0
    tomli-w==1.2.0
commands =
    pytest \
    {posargs:\
    --cov-config=pyproject.toml \
    --cov=scrapy_lint \
    --cov-report= \
    tests}
setenv =
    COVERAGE_FILE = .coverage.{envname}

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
skip_install = true

[testenv:mypy]
basepython = python3.10
deps =
    {[testenv]deps}
    mypy==1.19.1
commands =
    mypy {posargs:scrapy_lint tests}

[testenv:pylint]
deps =
    {[testenv]deps}
    pylint==4.0.4
    pylint-per-file-ignores==3.2.0
commands =
    pylint docs scrapy_lint tests

[testenv:min]
basepython = python3.10
deps =
    {[testenv]deps}
    packaging==22
    pathspec==0.10.1
    ruamel.yaml==0.17.5
    tomli==1.0.0

[testenv:docs]
changedir = docs
deps =
    -rdocs/requirements.txt
setenv =
    READTHEDOCS_PROJECT=scrapy-lint
    READTHEDOCS_VERSION=master
commands =
    sphinx-build -W -b html . {envtmpdir}/html

[testenv:twine]
deps =
    twine==6.2.0
    build==1.3.0
commands =
    python -m build --sdist
    twine check dist/*

[testenv:coverage]
changedir = {toxinidir}
skip_install = true
setenv =
    COVERAGE_FILE =
commands =
    coverage combine
    coverage report --skip-covered --show-missing --fail-under=100
