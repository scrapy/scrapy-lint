name: Add-ons
permissions:
  contents: read
on:
  schedule:
  - cron: '0 4 * * 1'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
    - name: Update the add-on data
      run: uv run --script utils/update_addons.py
    - name: Format the add-on data
      run: uvx pre-commit run --files scrapy_lint/data/addons.py || true
    - name: Open a pull request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        branch: addons
        title: Update the add-on data
        commit-message: Update the add-on data
        body: >
          Generated by `utils/update_addons.py`. Check the diff against the
          release notes of the add-ons it covers: a changed value makes SCP17
          ask for the matching line to be removed from settings modules.
